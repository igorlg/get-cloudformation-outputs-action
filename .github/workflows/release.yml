name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  post-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Verify dist/ is in sync with source
        run: |
          npm run build
          if ! git diff --exit-code --stat dist/; then
            echo "::error::dist/ is stale at release time. The 'feat'/'fix' PR that triggered this release should have committed a fresh dist/."
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Roll major version tag (v<major>)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR="v${{ needs.release-please.outputs.major }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          SHA=$(git rev-list -n 1 "$TAG")
          echo "Rolling $MAJOR to $SHA (from tag $TAG)"
          git tag -f "$MAJOR" "$SHA"
          git push origin "refs/tags/$MAJOR" --force
